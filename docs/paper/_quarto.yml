project:
  type: default
  output-dir: _output
  render:
    - paper.qmd
    - brief.qmd

bibliography: references.bib

execute:
  enabled: false

format:
  pdf:
    pdf-engine: xelatex
    documentclass: article
    fontsize: 11pt
    geometry: margin=1in
    linestretch: 1.15
    # figures sit where they are first cited (controller ruling, integration pass)
    fig-pos: 'H'
    # TeX Gyre Pagella, loaded by file name: it sits in the TeX Live tree but is
    # not registered with fontconfig, so the family name does not resolve.
    mainfont: texgyrepagella-regular.otf
    mainfontoptions:
      - BoldFont=texgyrepagella-bold.otf
      - ItalicFont=texgyrepagella-italic.otf
      - BoldItalicFont=texgyrepagella-bolditalic.otf
    mathfont: texgyrepagella-math.otf
    number-sections: true
    toc: true
    # the appendices quote PAP §11 verbatim, one level-3 heading per entry: keep them out of the TOC
    toc-depth: 2
    colorlinks: true
    # Task 21: the wide robustness and data tables are set landscape; figures are scaled to the
    # text width and at most 0.42 of the text height (integration pass); long identifiers may break
    # after an underscore; subscript and superscript digits missing from Pagella are typeset
    include-in-header:
      text: |
        \usepackage{pdflscape}
        \makeatletter
        \renewcommand*\pandocbounded[1]{\sbox\pandoc@box{#1}%
          \Gscale@div\@tempa{0.42\textheight}{\dimexpr\ht\pandoc@box+\dp\pandoc@box\relax}%
          \Gscale@div\@tempb{\linewidth}{\wd\pandoc@box}%
          \ifdim\@tempb\p@<\@tempa\p@\let\@tempa\@tempb\fi
          \ifdim\@tempa\p@<\p@\scalebox{\@tempa}{\usebox\pandoc@box}\else\usebox{\pandoc@box}\fi}
        \makeatother
        \renewcommand{\_}{\textunderscore\allowbreak}
        \usepackage{newunicodechar}
        \newunicodechar{₀}{\textsubscript{0}}
        \newunicodechar{₁}{\textsubscript{1}}
        \newunicodechar{₂}{\textsubscript{2}}
        \newunicodechar{₃}{\textsubscript{3}}
        \newunicodechar{₄}{\textsubscript{4}}
        \newunicodechar{₉}{\textsubscript{9}}
        \newunicodechar{⁴}{\textsuperscript{4}}
        \newunicodechar{⁻}{\textsuperscript{\textendash}}
    keep-tex: false
  html:
    toc: true
    toc-depth: 2
    number-sections: true
    embed-resources: true
